<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test page with accessibility problems</title>
  </head>
  <body>
    <main>
      <h1>Page with deliberate problems</h1>

      <!-- image-alt: image without alt -->
      <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" width="40" height="40" />

      <!-- label: field without a label -->
      <input type="text" />

      <!-- color-contrast: light gray text on white -->
      <p style="color: #bbbbbb; background: #ffffff">This text is barely readable.</p>

      <!-- link-name: link without text -->
      <a href="https://example.com"></a>

      <!-- target-size: two tiny buttons side by side (named, so button-name stays quiet) -->
      <div>
        <button type="button" aria-label="Previous" style="width: 12px; height: 12px; padding: 0; margin: 0"></button><button type="button" aria-label="Next" style="width: 12px; height: 12px; padding: 0; margin: 0"></button>
      </div>
    </main>
  </body>
</html>
